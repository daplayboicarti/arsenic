    var PAGES = [
      '<h2>Kestrel Point</h2><p class="byline">a novella</p><p>The light turned every eleven seconds, and Thomas Ambrose had counted them so many years running that he no longer needed the clock bolted above the stove to know the time. Eleven seconds of dark, then a white blade sweeping the water, then eleven more. He had married his life to that rhythm the way other men married women, and on Kestrel Point that had always seemed the better bargain.</p><p>The island was three acres of granite and gorse, tethered to the mainland by a supply boat that came Tuesdays, weather allowing. In November it rarely allowed. Thomas had provisioned for that, as he provisioned for everything: tinned fish stacked like bricks, paraffin drummed against the damp, a wireless set in the corner of the kitchen that he serviced with the same patience he gave the lamp itself.</p><p>It was the wireless that had started keeping him up nights.</p>',
      '<p>Not the news bulletins, which he took at seven and forgot by eight, but something underneath them, arriving after the station in Plymouth signed off and the band went to static. A pattern. Faint, regular, threading through the hiss like a heartbeat heard through a wall.</p><p>He\'d noticed it first on a Thursday in October, dismissed it as atmospheric noise, the sort of ghost signal that bounced off the ionosphere on cold nights and meant nothing at all. But it came back the next night, and the next, always a little after midnight, always for exactly the same stretch of minutes before it dissolved back into hiss.</p><p>Thomas had kept a log for eleven years — weather, vessel traffic, the mechanical moods of the lamp — and he added a new column without quite deciding to. <em>Signal, 00:14–00:31.</em> Some nights he wrote nothing else. Some nights, when the pattern seemed to shift, he wrote pages, trying to force sense onto something that resisted it.</p><p>He told himself it was only diligence. A keeper noticed things; that was the job description, whether or not the things noticed meant to be found.</p>',
      '<p>Before the island there had been a terrace house in Falmouth, and Elena, and six years that Thomas still measured his life against without meaning to. She had been a wireless operator herself, trained during the war and never quite willing to give it up afterward, and their courtship had been conducted partly in the ordinary way and partly in Morse, tapped out on the edge of the kitchen table when words felt too heavy to say plainly.</p><p><em>Stay</em>, she used to send him, three dots and a dash and a pause, when he talked about the lighthouse service and the postings that would take him away for months. He had gone anyway, because the alternative was a desk in an office that made his chest feel bricked in, and she had understood that better than he explained it, which was its own kind of love.</p><p>She had died in the spring before his last posting, quickly and unfairly, the way it so often goes, and Thomas had taken Kestrel Point four months later because solitude that chooses itself is easier to carry than solitude that arrives on its own.</p><p>He did not think of the wireless as a way of reaching her. He was not a foolish man. But he noticed that the signal had started in October, and that October was the month they\'d married, and he noticed himself noticing, and said nothing to anyone, because there was no one to say it to.</p>',
      '<p>By the second week of November he had a notebook full of dots and dashes that refused to resolve into English, or French, or the maritime code he\'d learned well enough to read distress calls in his sleep. It wasn\'t gibberish — gibberish had no rhythm, and this had rhythm the way a sentence has rhythm before you catch the words.</p><p>He tried it as numbers. He tried it backward. On the eleventh night he tried something he was faintly embarrassed by even alone in his own kitchen: he tried it as if it were old code, the private shorthand he and Elena had built between them, half standard Morse and half invention, spelling out endearments neither of them would have said aloud.</p><p>Three letters surfaced first, unmistakably: <em>K</em>, <em>E</em>, <em>S</em>. He stared at them so long the kettle went cold on the stove.</p><p>Not her name. His posting. Someone, somewhere down the coast, was sending the name of his own lighthouse back to him, and he did not know yet whether that was the least eerie explanation or the most.</p>',
      '<p>The storm came in on the fourteenth, faster than the forecast had promised, the barometer dropping like something falling down a stairwell. Thomas spent the afternoon lashing the boat shed and checking the lamp\'s mechanism twice over, because a keeper\'s first loyalty was never to his own comfort but to the vessels that would be out there trusting his eleven seconds of light to mean the difference between a course correction and a reef.</p><p>By nine the wind had a voice, a long continuous howl through the gap in the rocks the islanders had named, without much affection, the Whistle. Rain came sideways. The generator coughed twice and held. Thomas stood in the lamp room longer than he needed to, watching the beam cut through water that seemed determined to swallow it, and felt the old, clean fear of the job settle into him — not fear of the storm exactly, but fear of failing the thing the storm was testing.</p><p>He did not expect the wireless that night. Storms usually buried the signal entirely, the static so thick that even Plymouth came through like something drowning.</p><p>Instead, at fourteen minutes past midnight, it came through clearer than it ever had.</p>',
      '<p>He took it down with a hand that was not quite steady, and this time the letters arrived in whole words, spaced and patient, as if whoever sent them had finally trusted the channel to hold.</p><p><em>KESTREL POINT LIGHT VISIBLE FROM HERE. WHO KEEPS IT.</em></p><p>Thomas sat with that for a long moment. It was, when he made himself look at it plainly, the least mysterious sentence in the world — a question any operator on that stretch of coast might send another, the ordinary courtesy of two lonely stations checking that someone was awake at the far end of the dark. He had simply never had anyone to send it to him.</p><p>His hand found the key before his mind had finished deciding.</p><p><em>T. AMBROSE KEEPS IT. WHO ASKS.</em></p><p>The reply took longer than he liked, long enough that he began composing the disappointment he\'d feel if it never came, and then the set crackled back to life.</p><p><em>M. OKAFOR. DEVIL\'S SPIT STATION. SEVEN YEARS DECOMMISSIONED BUT SOMEONE HAS TO KEEP THE VALVES WARM.</em></p>',
      '<p>Devil\'s Spit was eleven miles down the coast, a station Thomas had known only as a name on the chart and a dark stretch on nights when its own light had still worked, before the Trinity House budget cuts closed it and left whatever equipment still functioned to rust with dignity. He had not known anyone kept it warm.</p><p>They talked — if the word applied to a conversation built from dots and dashes across a storm — for the better part of an hour. Mira Okafor was not, it emerged, a ghost, an operator\'s widow, or any of the half-formed shapes his mind had been assembling in the dark. She was thirty-one, ran weather relay for a marine survey outfit out of the decommissioned station because the pay was decent and the isolation suited her, and had noticed his light three months ago and started sending to it the way a person might wave at a lit window on a dark road, without much hope of a wave back.</p><p>The earlier signals, the ones he\'d spent a fortnight decoding like scripture, had been nothing stranger than her testing the set after a repair, sending the same string of letters over and over the way you\'d say a word aloud to see if it still worked. <em>KES TREL PO INT</em>, badly spaced, badly sent, meaning nothing at all until tonight, when the storm had cleared enough air between the stations for a proper signal to land.</p><p>Thomas found he was smiling in a way his face had nearly forgotten how to do.</p>',
      '<p>He told her about the log, the eleven-year column of weather and vessels, and after a pause admitted the newer column too, the one he\'d labeled <em>Signal</em> without knowing whose voice he was recording. He did not tell her about Elena, not that night, though something in the shape of what he did say must have carried the outline of it, because Mira\'s reply, when it came, was gentler than the question warranted.</p><p><em>SOUNDS LIKE YOU WERE LISTENING FOR SOMEONE FOR A WHILE BEFORE I CAME ALONG.</em></p><p>He looked at that for a long time before he answered, the lamp turning its patient eleven seconds through the window behind him, the storm easing at last into ordinary rain.</p><p><em>SUPPOSE I WAS. GOOD PRACTICE, THOUGH. MADE ME QUICK ENOUGH TO CATCH YOU.</em></p><p>Her laugh did not travel down a wire in dots and dashes, but he heard it anyway, in the particular quickness of the reply that followed, and in something that had loosened in his own chest for the first time in longer than he wanted to count.</p>',
      '<p>They agreed, before the band went back to static near two in the morning, to a standing time — half past midnight, when Plymouth signed off and the channel was theirs. Not every night; Mira\'s relay work had its own demands, and Thomas would not let the lamp\'s needs come second to anything, not even this. But a fixed point, all the same, the kind two people build a week around without quite calling it that yet.</p><p>He went up to check the lamp once more before he let himself sleep, out of habit more than need, and stood a while in the small glass room watching the beam go out over water that had calmed to a sullen swell. Eleven miles down the coast, he knew now, another light was dark and another person was awake anyway, keeping valves warm for no one who\'d asked her to, the way he\'d kept a log for a signal he could not have explained to anyone who\'d asked him to justify it.</p><p>It occurred to him, not for the first time but freshly, that the sea did this — took two isolations and, if you were patient and a little lucky, ran a wire between them.</p>',
      '<p>Winter came in properly after that, the way it always did on Kestrel Point, sealing the island under short grey days and long black ones, and Thomas kept the light exactly as he always had, eleven seconds of dark and a white blade over the water. But the log had a new shape to it now. Weather. Vessels. And under <em>Signal</em>, no longer a mystery to be decoded but an appointment to be kept — half past midnight, most nights, two operators trading the small news of small islands until the static came back to reclaim the channel.</p><p>He did not know yet what the spring would make of it, whether an eleven-mile stretch of cold water could be crossed by anything sturdier than dots and dashes, or whether it would stay exactly what it was, which was already more than he\'d let himself want in a long time. He found, turning the question over the way he turned the pages of the log, that he did not need to answer it tonight.</p><p>The light kept turning. Somewhere down the coast, another keeper who was not a keeper of anything but her own choosing was keeping valves warm and, he suspected, watching for his beam the way he had once, without knowing it, been watching for hers.</p><p class="end">The End</p>'
    ];

:root {
  --base: #1e1e2e;
  --mantle: #181825;
  --crust: #11111b;
  --surface0: #313244;
  --surface1: #45475a;
  --surface2: #585b70;
  --overlay0: #6c7086;
  --overlay1: #7f849c;
  --text: #cdd6f4;
  --subtext1: #bac2de;
  --subtext0: #a6adc8;
  --blue: #89b4fa;
  --lavender: #b4befe;
  --mauve: #cba6f7;
  --pink: #f5c2e7;
  --red: #f38ba8;
  --peach: #fab387;
  --yellow: #f9e2af;
  --green: #a6e3a1;
  --teal: #94e2d5;
  --sapphire: #74c7ec;
  
  --accent: var(--mauve);
  --claude: #d1795a;
}


[data-theme="macchiato"] {
  --base: #24273a;
  --mantle: #1e2030;
  --crust: #181926;
  --surface0: #363a4f;
  --surface1: #494d64;
  --surface2: #5b6078;
  --overlay0: #6e738d;
  --overlay1: #8087a2;
  --text: #cad3f5;
  --subtext0: #a5adcb;
}
[data-theme="frappe"] {
  --base: #303446;
  --mantle: #292c3c;
  --crust: #232634;
  --surface0: #414559;
  --surface1: #51576d;
  --surface2: #626880;
  --overlay0: #737994;
  --overlay1: #838ba7;
  --text: #c6d0f4;
  --subtext0: #b5bfe2;
}


[data-accent="blue"] {
  --accent: var(--blue);
}
[data-accent="pink"] {
  --accent: var(--pink);
}
[data-accent="teal"] {
  --accent: var(--teal);
}
[data-accent="peach"] {
  --accent: var(--peach);
}
[data-accent="green"] {
  --accent: var(--green);
}


[data-wallpaper="gradient"] #startPage {
  background: linear-gradient(
    150deg,
    var(--base),
    color-mix(in srgb, var(--accent) 22%, var(--base))
  );
}
[data-wallpaper="mesh"] #startPage {
  background:
    radial-gradient(
      60% 70% at 20% 15%,
      color-mix(in srgb, var(--accent) 26%, transparent),
      transparent
    ),
    radial-gradient(
      55% 60% at 85% 80%,
      color-mix(in srgb, var(--sapphire) 22%, transparent),
      transparent
    ),
    var(--base);
}


[data-backend="ultraviolet"] #backendBadge {
  display: none;
}

* {
  box-sizing: border-box;
}
*,
*::before,
*::after {
  corner-shape: squircle;
}

html {
  height: 100%;
}
body {
  height: 100%;
  margin: 0;
  background: var(--crust);
  color: var(--text);
  font-family: 'Public Sans';
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  background: none;
  border: 0;
}

::placeholder {
  color: var(--overlay0);
}


svg {
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#app {
  display: grid;
  grid-template-columns: 312px 1fr;
  height: 100%;
  transition: grid-template-columns 0.2s ease;
}
#app.collapsed {
  grid-template-columns: 0 1fr;
}



#sidebar {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  padding: 12px 12px;

#chatMain {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
#chatHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--surface0);
  flex: none;
}
.chatHeaderTitle {
  font-weight: 600;
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chatHeaderActions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: none;
}
.chatAvatarBtn {
  width: 32px;
  height: 32px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  padding: 0;
  overflow: hidden;
  background: var(--surface0);
  border: 0;
  cursor: pointer;
  flex: none;
}
.chatAvatarBtn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.chatAvatarFallback {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  font-size: 12px;
  font-weight: 700;
  color: var(--subtext0);
}

#chatMessages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
}
.chatMessage {
  position: relative;
  display: flex;
  gap: 12px;
  margin-top: 16px;
}
.chatMessage:first-child {
  margin-top: 0;
}
.chatMessage.chatMessageGrouped {
  margin-top: 0;
}
.chatMessageAvatar {
  flex: none;
  width: 38px;
  height: 38px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface0);
}
.chatMessageAvatarSpacer {
  height: auto;
  aspect-ratio: unset;
  background: none;
}
.chatMessageBody {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: break-word;
  font-size: 15px;
}
.chatMessageMeta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.chatMessageHoverActions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 8px;
  vertical-align: middle;
  opacity: 0;
  transition: opacity 0.1s;
}
.chatMessage:hover .chatMessageHoverActions {
  opacity: 1;
}
.chatMessageHoverActions small {
  color: var(--overlay0);
  font-size: 12px;
}
.chatMessageText {
  white-space: pre-wrap;
}
.chatMessageLink {
  color: var(--accent);
  text-decoration: underline;
}
.chatChannelMention {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
}
.chatMessageMeta b {
  font-weight: 600;
  font-size: 14px;
}
.chatMessageMeta small {
  color: var(--overlay0);
  font-size: 12px;
}
.chatAdminBadge {
  flex: none;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--accent);
  background: var(--surface1);
  padding: 2px 6px;
  border-radius: 6px;
}
.chatPinnedBadge {
  flex: none;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--yellow);
  background: var(--surface1);
  padding: 2px 6px;
  border-radius: 6px;
}
.chatMessageImage {
  display: block;
  max-width: 360px;
  max-height: 360px;
  border-radius: 12px;
  margin-bottom: 4px;
}
.chatMessagesLoadingMore {
  display: flex;
  justify-content: center;
  padding: 8px 0;
}
.chatMessagesLoadingMore .chatSpinner {
  width: 20px;
  height: 20px;
  border-width: 2px;
}
.chatMessageAction {
  background: none;
  border: 0;
  color: var(--overlay0);
  padding: 0;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.1s;
}
.chatMessageAction svg {
  width: 14px;
  height: 14px;
}
.chatMessageAction:hover {
  color: var(--red);
}
.chatMessage:hover .chatMessageAction {
  opacity: 1;
}

#chatComposer {
  padding: 16px 24px;
  border-top: 1px solid var(--surface0);
  flex: none;
}
.chatComposerField {
  position: relative;
}
.chatComposerField textarea {
  display: block;
  width: 100%;
  height: 44px;
  max-height: 124px;
  padding: 12px 44px 12px 16px;
  border-radius: 22px;
  border: 1px solid var(--surface0);
  background: var(--base);
  outline: 0;
  font: inherit;
  font-size: 15px;
  line-height: 20px;
  resize: none;
  overflow-y: auto;
  box-sizing: border-box;
}
.chatComposerField.hasImageBtn textarea {
  padding-left: 44px;
}
.chatComposerField textarea:focus {
  border-color: var(--accent);
}
.chatImageBtn {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 1px solid var(--surface0);
  color: var(--subtext1);
  cursor: pointer;
}
.chatImageBtn:hover {
  background: var(--surface0);
  color: var(--text);
}
.chatImageBtn svg {
  width: 16px;
  height: 16px;
}
.chatSendBtn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  border: 0;
  color: var(--crust);
  cursor: pointer;
}
.chatSendBtn svg {
  width: 16px;
  height: 16px;
  stroke: var(--crust);
}
.chatSendBtn:hover {
  filter: brightness(1.1);
}


.accent-red {
  background: var(--red);
}
.accent-peach {
  background: var(--peach);
}
.accent-yellow {
  background: var(--yellow);
}
.accent-green {
  background: var(--green);
}
.accent-teal {
  background: var(--teal);
}
.accent-sapphire {
  background: var(--sapphire);
}
.accent-blue {
  background: var(--blue);
}
.accent-lavender {
  background: var(--lavender);
}
.accent-mauve {
  background: var(--mauve);
}
.accent-pink {
  background: var(--pink);
}
.accent-subtext0 {
  background: var(--subtext0);
}

const HOST_ICONS = [
  [/^mail\\.google/, "mail"],
  [/notion/, "notebook"],
  [/^calendar\\.google/, "calendar"],
  [/slack/, "hash"],
  [/youtube/, "play"],
  [/github/, "git-branch"],
  [/reddit/, "message-circle"],
  [/wikipedia/, "book"],
  [/google|duckduckgo|bing|yahoo/, "search"],
];



const $ = (sel) => document.querySelector(sel);

function svg(icon, size) {
  return \`<svg xmlns="http://www.w3.org/2000/svg" width="\${size}" height="\${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">\${ICONS[icon]}</svg>\`;
}

function iconForHost(host) {
  return HOST_ICONS.find(([pattern]) => pattern.test(host ?? ""))?.[1] ?? "globe";
}

function hostOf(url) {
  try {
    return new URL(url).hostname;
  } catch {
    return null;
  }
}

function titleFor(url) {
  return hostOf(url)?.replace(/^www\\./, "") ?? "New Tab";
}

function resolve(input, engine) {
  const q = input.trim();
  if (!q) return null;
  if (/^https?:\\/\\//i.test(q)) return q;
  if (/^[\\w-]+(\\.[\\w-]+)+(\\/.*)?$/.test(q) && !q.includes(" ")) return \`https://\${q}\`;
  return ENGINES[engine] + encodeURIComponent(q);
}



const DEFAULTS = { search: "duckduckgo", cloak: "default", theme: "mocha", accent: "mauve", wallpaper: "mesh", bookmarks: [] };

function loadSettings() {
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {};
  } catch {
    saved = {};
  }
  if (typeof saved !== "object") saved = {};

  const out = { ...DEFAULTS, ...saved };
  if (!SEARCH_OPTIONS.some(([v]) => v === out.search)) out.search = DEFAULTS.search;
  if (!CLOAK_OPTIONS.some(([v]) => v === out.cloak)) out.cloak = DEFAULTS.cloak;
  if (!THEME_OPTIONS.some(([v]) => v === out.theme)) out.theme = DEFAULTS.theme;
  if (!WALLPAPER_OPTIONS.some(([v]) => v === out.wallpaper)) out.wallpaper = DEFAULTS.wallpaper;
  if (!ACCENTS.includes(out.accent)) out.accent = DEFAULTS.accent;
  if (!Array.isArray(out.bookmarks)) out.bookmarks = [];
  out.bookmarks = out.bookmarks.slice(0, MAX_BOOKMARKS);
  return out;
}

const settings = loadSettings();

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (error) {
    console.error("couldn't save settings", error);
  }
}

function wispUrl() {
  try {
    return localStorage.getItem(WISP_KEY) || DEFAULT_WISP;
  } catch {
    return DEFAULT_WISP;
  }
}

function setWisp(url) {
  try {
    if (url) localStorage.setItem(WISP_KEY, url);
    else localStorage.removeItem(WISP_KEY);
  } catch (error) {
    console.error("couldn't save wisp url", error);
  }
}

function applyAppearance() {
  Object.assign(document.documentElement.dataset, {
    theme: settings.theme,
    accent: settings.accent,
    wallpaper: settings.wallpaper,
    backend: "scramjet",
  });
  document.title = CLOAK_TITLES[settings.cloak] ?? "arsenic";
}



let tabs = [];
let activeId = null;
let seq = 0;

function tabById(id) {
  return tabs.find((tab) => tab.id === id);
}

function activeTab() {
  return tabById(activeId) ?? null;
}

function activeUrl() {
  const tab = activeTab();
  return tab && tab.kind === "proxy" ? (tab.url ?? null) : null;
}

function newTab(url = null) {
  const id = ++seq;
  const iframe = document.createElement("iframe");
  const tab = {
    id,
    kind: "proxy",
    url: null,
    title: "New Tab",
    favicon: null,
    color: TAB_COLORS[id % TAB_COLORS.length],
    el: iframe,
    request: null,
    inspecting: false,
  };
  iframe.dataset.tab = String(id);
  $("#frames").appendChild(iframe);
  tabs.push(tab);
  focus(id);
  if (url) navigate(tab, url);
  renderAll();
  return tab;
}

function openInternal(kind) {
  const existing = tabs.find((tab) => tab.kind === kind);
  if (existing) {
    focus(existing.id);
    return existing;
  }
  const id = ++seq;
  const tab = {
    id,
    kind,
    url: null,
    title: kind === "settings" ? "Settings" : "Chat",
    favicon: null,
    color: null,
    el: null,
    request: null,
    inspecting: false,
  };
  tabs.push(tab);
  focus(id);
  renderAll();
  return tab;
}

function closeTab(id) {
  const i = tabs.findIndex((tab) => tab.id === id);
  if (i === -1) return;
  tabs[i].el?.remove();
  tabs.splice(i, 1);
  if (activeId === id) activeId = tabs[Math.min(i, tabs.length - 1)]?.id ?? null;
  if (!tabs.length) newTab();
  renderAll();
}

function focus(id) {
  activeId = id;
  renderAll();
}

function navigate(tab, url) {
  tab.url = url;
  tab.title = titleFor(url);
  tab.favicon = null;
  tab.inspecting = false;
  tab.request = url;
  go(tab);
  renderAll();
}

function open(url) {
  const tab = activeTab();
  if (tab && tab.kind === "proxy") navigate(tab, url);
  else newTab(url);
}

function reload() {
  const tab = activeTab();
  if (!tab?.url) return;
  tab.inspecting = false;
  tab.el?.contentWindow?.postMessage({ type: "frame", action: "reload" }, "*");
}

function inspect() {
  const tab = activeTab();
  if (!tab?.url) return;
  tab.el?.contentWindow?.postMessage({ type: "frame", action: "inspect" }, "*");
  tab.inspecting = !tab.inspecting;
}



const handshakes = new Map(); 

function embedSrc() {
  const override = new URLSearchParams(location.search).get("embed");
  const url = new URL(override || "https://cdn.jsdelivr.net/gh/daplayboicarti/arsenic@main/server/embed/embed.svg");
  url.searchParams.set("wisp", wispUrl());
  return url.href;
}

function handshake(iframe) {
  let entry = handshakes.get(iframe);
  if (!entry) {
    let resolve, reject;
    const promise = new Promise((res, rej) => {
      resolve = res;
      reject = rej;
    });
    const timer = setTimeout(() => reject(new Error("embed didn't become ready")), 15000);
    entry = {
      resolve: () => {
        clearTimeout(timer);
        resolve();
      },
      promise,
    };
    handshakes.set(iframe, entry);
  }
  return entry.promise;
}

function go(tab) {
  if (!tab.request || !tab.el) return;
  if (!tab.el.src) tab.el.src = embedSrc();
  handshake(tab.el)
    .then(() => {
      tab.el.contentWindow.postMessage({ type: "frame", action: "go", url: tab.request }, "*");
    })
    .catch((error) => console.error(error));
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;

  if (data.type === "ready") {
    for (const [iframe, entry] of handshakes) {
      if (iframe.contentWindow === event.source) entry.resolve();
    }
  } else if (data.type === "nav") {
    const tab = tabs.find((t) => t.el && t.el.contentWindow === event.source);
    if (!tab || !data.url) return;
    tab.url = data.url;
    tab.title = data.title || titleFor(data.url);
    if (data.favicon) {
      tab.favicon = data.favicon;
      const host = hostOf(data.url);
      const bookmark = settings.bookmarks.find((b) => hostOf(b.url) === host);
      if (bookmark) bookmark.favicon = data.favicon;
    }
    renderAll();
  }
});



function renderAll() {
  renderTabs();
  renderPages();
  renderFrames();
  renderUrlBar();
  renderBookmarks();
}

function renderTabs() {
  const list = $("#tablist");
  list.innerHTML = "";
  for (const tab of tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (tab.id === activeId ? " active" : "");
    el.setAttribute("role", "button");
    el.tabIndex = 0;

    const fav = document.createElement("div");
    fav.className = "fav" + (tab.favicon || !tab.url ? " bare" : \` accent-\${tab.color}\`);
    if (tab.favicon) {
      const img = document.createElement("img");
      img.src = tab.favicon;
      img.alt = "";
      img.draggable = false;
      fav.appendChild(img);
    } else if (tab.url) {
      fav.innerHTML = svg(iconForHost(hostOf(tab.url)), 18);
    }

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = tab.title;

    const close = document.createElement("button");
    close.className = "close";
    close.type = "button";
    close.title = "Close tab";
    close.innerHTML = svg("x", 18);
    close.addEventListener("click", (event) => {
      event.stopPropagation();
      closeTab(tab.id);
    });

    el.append(fav, title, close);
    el.addEventListener("click", () => focus(tab.id));
    el.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        focus(tab.id);
      }
    });
    list.appendChild(el);
  }
}

function renderPages() {
  const tab = activeTab();
  $("#startPage").classList.toggle("active", !!tab && tab.kind === "proxy" && !tab.url);
  $("#settingsPage").classList.toggle("active", tab?.kind === "settings");
}

function renderFrames() {
  for (const tab of tabs) {
    if (tab.el) tab.el.classList.toggle("active", tab.id === activeId);
  }
}

function renderUrlBar() {
  const input = $("#urlInput");
  const tab = activeTab();
  const shown = tab ? (tab.kind !== "proxy" ? \`arsenic://\${tab.kind}\` : (tab.url ?? "")) : "";
  if (document.activeElement !== input) input.value = shown;

  $("#reload").disabled = !activeUrl();
  $("#devtools").disabled = !activeUrl();
  const url = activeUrl();
  $("#bookmarkBtn").disabled = !url;
  $("#bookmarkBtn").classList.toggle("active", !!url && isBookmarked(url));
}



function isBookmarked(url) {
  const host = hostOf(url);
  return !!host && settings.bookmarks.some((b) => hostOf(b.url) === host);
}

function tabForHost(host) {
  return tabs.find((tab) => tab.url && hostOf(tab.url) === host);
}

function isOpen(bookmark) {
  return !!tabForHost(hostOf(bookmark.url));
}

function toggleBookmark(url) {
  const host = hostOf(url);
  if (!host) return;
  const i = settings.bookmarks.findIndex((b) => hostOf(b.url) === host);
  if (i !== -1) {
    settings.bookmarks.splice(i, 1);
  } else if (settings.bookmarks.length < MAX_BOOKMARKS) {
    settings.bookmarks.push({
      url,
      icon: iconForHost(host),
      color: TAB_COLORS[settings.bookmarks.length % TAB_COLORS.length],
      favicon: null,
    });
  }
  saveSettings();
  renderBookmarks();
  renderUrlBar();
}

function renderBookmarks() {
  const box = $("#bookmarks");
  box.dataset.count = String(settings.bookmarks.length);
  box.innerHTML = "";
  for (const bookmark of settings.bookmarks) {
    const el = document.createElement("div");
    el.className = "bookmark" + (isOpen(bookmark) ? " open" : "");
    el.title = hostOf(bookmark.url) ?? "";
    if (bookmark.favicon) {
      const img = document.createElement("img");
      img.src = bookmark.favicon;
      img.alt = "";
      img.draggable = false;
      el.appendChild(img);
    } else {
      el.innerHTML = svg(bookmark.icon, 40);
      el.classList.add(\`accent-\${bookmark.color}\`);
    }
    el.addEventListener("click", () => {
      const openTab = tabForHost(hostOf(bookmark.url));
      if (openTab) focus(openTab.id);
      else newTab(bookmark.url);
    });
    box.appendChild(el);
  }
}



let openSelect = null; 

function makeSelect(containerId, options, getValue, onPick) {
  const root = $(containerId);
  const id = containerId.replace("#", "");
  const menuId = \`\${id}-menu\`;

  root.innerHTML = \`
    <button type="button" class="select-trigger" role="combobox" aria-controls="\${menuId}" aria-expanded="false">
      <span class="value"></span>
      <span class="chev">\${svg("chevron-down", 12)}</span>
    </button>
    <div class="select-menu" id="\${menuId}" role="listbox" tabindex="-1"></div>\`;

  const trigger = root.querySelector(".select-trigger");
  const menu = root.querySelector(".select-menu");
  const valueEl = root.querySelector(".value");
  let active = 0;

  function currentLabel() {
    return (options.find(([val]) => val === getValue()) ?? options[0])[1];
  }

  function renderMenu() {
    menu.innerHTML = "";
    options.forEach(([val, text], i) => {
      const option = document.createElement("div");
      option.className = "select-option" + (i === active ? " active" : "");
      option.setAttribute("role", "option");
      option.tabIndex = -1;
      option.setAttribute("aria-selected", String(val === getValue()));
      option.innerHTML = \`<span class="text">\${text}</span><span class="check">\${svg("check", 12)}</span>\`;
      option.addEventListener("click", () => pick(val));
      option.addEventListener("pointermove", () => {
        active = i;
        renderMenu();
      });
      menu.appendChild(option);
    });
  }

  function open() {
    active = Math.max(0, options.findIndex(([val]) => val === getValue()));
    if (openSelect && openSelect !== root) closeMenu(openSelect);
    root.classList.add("open");
    trigger.setAttribute("aria-expanded", "true");
    openSelect = root;
    renderMenu();
  }

  function close() {
    root.classList.remove("open");
    trigger.setAttribute("aria-expanded", "false");
    if (openSelect === root) openSelect = null;
  }

  function toggle() {
    if (root.classList.contains("open")) close();
    else open();
  }

  function pick(val) {
    close();
    onPick(val);
  }

  function move(delta) {
    active = (active + delta + options.length) % options.length;
    renderMenu();
  }

  trigger.addEventListener("click", toggle);
  trigger.addEventListener("keydown", (event) => {
    const isOpen = root.classList.contains("open");
    const keys = {
      Escape: () => close(),
      Enter: () => (isOpen ? pick(options[active][0]) : toggle()),
      " ": () => (isOpen ? pick(options[active][0]) : toggle()),
      ArrowDown: () => (isOpen ? move(1) : open()),
      ArrowUp: () => (isOpen ? move(-1) : open()),
      Home: () => isOpen && move(-active),
      End: () => isOpen && move(options.length - 1 - active),
    };
    if (!keys[event.key]) return;
    event.preventDefault();
    keys[event.key]();
  });

  valueEl.textContent = currentLabel();
  return { refresh: () => (valueEl.textContent = currentLabel()) };
}

function closeMenu(select) {
  select.classList.remove("open");
  select.querySelector(".select-trigger").setAttribute("aria-expanded", "false");
  if (openSelect === select) openSelect = null;
}

document.addEventListener("pointerdown", (event) => {
  if (openSelect && !event.target.closest(".select")) closeMenu(openSelect);
});



$("#toggleSidebar").innerHTML = svg("panel-left", 20);
$("#reload").innerHTML = svg("rotate-cw", 20);
$("#fullscreen").innerHTML = svg("maximize", 20);

});

let fullscreen = false;

  if (document.fullscreenElement) document.exitFullscreen();
  else $("#content").requestFullscreen();

});

  fullscreen = !!document.fullscreenElement;
  $("#fullscreen").innerHTML = svg(fullscreen ? "minimize" : "maximize", 20);

const urlInput = $("#urlInput");
urlInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    const target = resolve(urlInput.value, settings.search);
    if (target) open(target);
    urlInput.blur();
  }
  if (event.key === "Escape") urlInput.blur();
});
urlInput.addEventListener("focus", () => urlInput.select());

const startSearch = $("#startSearch");
startSearch.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  const target = resolve(startSearch.value, settings.search);
  if (target) open(target);
  startSearch.value = "";
});

window.addEventListener("keydown", (event) => {
  if (!(event.metaKey || event.ctrlKey)) return;
  const key = event.key.toLowerCase();
  if (key === "t") newTab();
  else if (key === "w") closeTab(activeId);
  else if (key === "s") $("#app").classList.toggle("collapsed");
  else if (key === "l") {
    event.preventDefault();
    urlInput.focus();
  } else return;
  event.preventDefault();
});


const selectSearch = makeSelect("#setSearch", SEARCH_OPTIONS, () => settings.search, (val) => {
  settings.search = val;
  saveSettings();
  selectSearch.refresh();
});
const selectCloak = makeSelect("#setCloak", CLOAK_OPTIONS, () => settings.cloak, (val) => {
  settings.cloak = val;
  saveSettings();
  selectCloak.refresh();
  applyAppearance();
});
const selectTheme = makeSelect("#setTheme", THEME_OPTIONS, () => settings.theme, (val) => {
  settings.theme = val;
  saveSettings();
  selectTheme.refresh();
  applyAppearance();
});
const selectWallpaper = makeSelect("#setWallpaper", WALLPAPER_OPTIONS, () => settings.wallpaper, (val) => {
  settings.wallpaper = val;
  saveSettings();
  selectWallpaper.refresh();
  applyAppearance();
});

const accents = $("#accents");
for (const accent of ACCENTS) {
  const swatch = document.createElement("button");
  swatch.type = "button";
  swatch.className = \`swatch accent-\${accent}\` + (accent === settings.accent ? " on" : "");
  swatch.title = accent;
  swatch.addEventListener("click", () => {
    settings.accent = accent;
    saveSettings();
    applyAppearance();
    for (const el of accents.children) el.classList.toggle("on", el === swatch);
  });
  accents.appendChild(swatch);
}

const wispInput = $("#wispUrl");
wispInput.value = wispUrl();
$("#wispSave").addEventListener("click", () => {
  setWisp(wispInput.value.trim());
});

$("#aboutBlank").addEventListener("click", () => {
  const win = window.open("about:blank");
  if (!win) return;
  const frame = win.document.createElement("iframe");
  frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
  frame.src = location.href;
  win.document.body.style.margin = "0";
  win.document.body.append(frame);
});
